<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>全部情境 — 日語日日聽</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>日語<span>日日</span>聽</h1>
    <nav><a href="./">回今天</a></nav>
  </header>
  <p class="hint">潑墨圖鑑：365 個情境依主題分組。練完一課，那張插畫才會上色、揭曉名稱；點任一張卡片即可練習。<b id="collected"></b></p>
  <div class="filter"><input id="q" type="search" placeholder="搜尋標題／主題（中文或日文）" aria-label="搜尋情境"><label><input id="onlyTodo" type="checkbox"> 只看未完成</label></div>
  <div id="groups"></div>
</div>
<script type="module">
import { todayIndex } from './js/day.js';
import { bgFor, setPageBg } from './js/cats.js';
import { doneIds } from './js/progress.js';
setPageBg('bg/generic.webp');
const scenes = await (await fetch('data/scenes.json')).json();
const today = todayIndex();
const doneDays = doneIds();
const groups = new Map();
for (const x of scenes) { if (!groups.has(x.category)) groups.set(x.category, []); groups.get(x.category).push(x); }
const root = document.getElementById('groups');
let total = 0;
for (const [cat, list] of groups) {
  const g = document.createElement('section'); g.className = 'group';
  const got = list.filter(x => doneDays.has(x.id)).length; total += got;
  g.innerHTML = `<div class="banner"><h3>${cat}<small>已收 ${got} / ${list.length}</small><span class="meter"><i style="width:${Math.round(got / list.length * 100)}%"></i></span></h3></div><div class="grid"></div>`;
  g.querySelector('.banner').style.backgroundImage = `url("${bgFor(cat)}")`;
  const grid = g.querySelector('.grid');
  for (const x of list) {
    const a = document.createElement('a'); a.href = `./?d=${x.id}`;
    a.className = (x.id === today ? 'today' : '') + (doneDays.has(x.id) ? ' is-done' : '');
    const own = doneDays.has(x.id); // 沒練過就保留懸念：名稱遮住、搜尋只比對主題
    a.dataset.q = (own ? `${x.title_zh} ${x.title_ja} ${x.category}` : x.category).toLowerCase(); a.dataset.done = doneDays.has(x.id) ? '1' : '0';
    const id3 = String(x.id).padStart(3, '0');
    a.innerHTML = `<span class="thumb"><img loading="lazy" alt="" src="img/${id3}.webp" onerror="this.parentNode.classList.add('missing');this.remove()"></span><span class="txt"><small>第 ${x.id} 天</small><b></b><i></i></span>`;
    a.querySelector('b').textContent = own ? x.title_zh : '？？？'; a.querySelector('i').textContent = own ? x.title_ja : '練完揭曉';
    grid.appendChild(a);
  }
  root.appendChild(g);
}
const q = document.getElementById('q'), onlyTodo = document.getElementById('onlyTodo');
function applyFilter() {
  const s = q.value.trim().toLowerCase();
  document.querySelectorAll('.grid a').forEach(a => { a.style.display = ((!s || a.dataset.q.includes(s)) && !(onlyTodo.checked && a.dataset.done === '1')) ? '' : 'none'; });
  document.querySelectorAll('.group').forEach(g => { g.style.display = [...g.querySelectorAll('.grid a')].some(a => a.style.display !== 'none') ? '' : 'none'; });
}
document.getElementById('collected').textContent = `目前已收集 ${total} / ${scenes.length}。`;
q.oninput = applyFilter; onlyTodo.onchange = applyFilter;
</script>
<script src="js/vendor/gc-config.js"></script>
<script async src="js/vendor/count.js"></script>
</body>
</html>
